<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter A Adventure | Suhaila Kids</title><style>:root{--pink:#f7dfe7;--purple:#eae2fa;--mint:#dff3e9;--cream:#fff9f2;--ink:#625468;--gold:#e9b65c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff9f2,#f9f2ff);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}main{max-width:690px;margin:auto;padding:18px 15px 50px}.head{text-align:center;padding:12px}.head small{color:#927e9b}.head h1{margin:8px;font-size:27px}.panel{background:white;border:2px solid #efe4f2;border-radius:27px;padding:24px 18px;box-shadow:0 9px 26px #9d82951a;text-align:center;min-height:450px}.hidden{display:none!important}.pill{background:#f0e8fb;border-radius:50px;padding:8px 16px;display:inline-block;font-size:13px}.big{font-size:76px;color:#9375bc;font-weight:900;line-height:1.3}.btn{border:0;border-radius:17px;padding:15px 23px;background:#b59bda;color:#fff;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #9276b9;margin:7px;touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9276b9}.secondary{background:#f3e8f8;color:#6e5a81;box-shadow:none}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.option{background:#fff;border:3px solid #eee4f5;border-radius:21px;padding:14px 5px;cursor:pointer;font-size:18px;min-height:140px}.option:active{transform:scale(.96)}.emoji{font-size:61px;display:block;margin-bottom:10px}.ok{border-color:#8ccab0!important;background:#eaf9ef!important}.bad{border-color:#f3b0b0!important;background:#fff0f0!important}.stars{font-size:27px;letter-spacing:5px}.progress{height:13px;border-radius:30px;background:#efe9f4;overflow:hidden;margin:15px 0 20px}.bar{height:100%;background:linear-gradient(90deg,#dcb5d1,#b9a4e4);width:0%;transition:width .4s}.feedback{min-height:40px;font-weight:bold;font-size:20px;color:#559a76}.word{font-size:30px;color:#8c73af;font-weight:bold;direction:ltr}.lettergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:25px 0}.letter{border:2px solid #dfd3ee;background:#faf6ff;border-radius:17px;font-size:37px;padding:15px;cursor:pointer;color:#7a6399}.letter.found{background:#dff3e9;border-color:#90cbb0}.line{font-size:16px;line-height:1.9}.scene{border:2px solid #e2e9db;background:#f9fdf9;border-radius:22px;padding:20px;margin:18px auto;max-width:400px;font-size:74px}.canvasWrap{position:relative;max-width:350px;margin:16px auto;border:2px solid #e5d5ed;border-radius:19px;overflow:hidden;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 35px,#d4e4e1 36px,#fff 37px,#fff 72px,#f3d2dc 73px,#fff 74px)}canvas{display:block;width:100%;height:240px;touch-action:none}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:205px;color:#b9a4d05c;pointer-events:none;font-family:Arial,sans-serif;direction:ltr}.name{width:90%;padding:17px;border:2px solid #e0d1ef;border-radius:16px;font-size:22px;text-align:center;outline:none}.confetti{font-size:56px;animation:bounce 1s infinite alternate}@keyframes bounce{to{transform:translateY(-13px) rotate(8deg)}}.speak{font-size:17px}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{font-size:13px;color:#96859c}.tag{background:#e4f4e9;border-radius:12px;padding:6px 12px;display:inline-block}.badge{font-size:19px;color:#ad7f35}.cards{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.mini{padding:15px;border:2px solid #eadff0;border-radius:20px;min-width:125px;background:#faf8ff}button:focus-visible{outline:3px solid #8b78bd}@media(max-width:410px){.option{min-height:120px;font-size:15px}.emoji{font-size:48px}.panel{padding:20px 10px}.btn{font-size:16px}}</style></head><body><main><div class="head"><small>Suhaila Kids · Level 3</small><h1>🌷 Suhaila Kids World</h1><div class="stars" id="starTop">☆☆☆☆☆☆</div><div class="progress"><div class="bar" id="bar"></div></div></div><section class="panel" id="screen"></section></main><script>
const root=document.getElementById('screen'),bar=document.getElementById('bar'),starTop=document.getElementById('starTop');let name=sessionStorage.getItem('suhailaName')||'',step=0,score=0,lock=false,found=new Set(),drawn=false,writing='A';const total=7;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window)){return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.72;u.pitch=1.12;speechSynthesis.speak(u)}function btn(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}function update(){bar.style.width=Math.round(step/total*100)+'%';starTop.textContent='★'.repeat(score)+'☆'.repeat(Math.max(0,total-score))}function reward(msg){score++;update();document.getElementById('feedback').textContent='⭐ '+msg+' '+name+'!';document.getElementById('next').classList.remove('hidden');try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}}function next(){step++;render()}function render(){lock=false;update();if(step===0){root.innerHTML=`<div class="confetti">🌈⭐</div><h2>Welcome to Letter A!</h2><div class="big">A a</div><p>Welcome, superstar! What is your name?</p><input id="kid" class="name" maxlength="28" placeholder="Your name" value="${safe(name)}"><p class="hint">Your name stays on this device only</p>${btn('Start Adventure! 🚀','start()')}`;return}if(step===1){root.innerHTML=`<span class="pill">Mission 1 · Listen & Discover</span><div class="big">A a</div><h2>Hello, ${safe(name)}! 👋</h2><p>Listen to the letter and words</p><div class="cards"><div class="mini"><span class="emoji">🍎</span>Apple</div><div class="mini"><span class="emoji">🐜</span>Ant</div><div class="mini"><span class="emoji">💪</span>arm</div></div><p>${btn('🔊 Listen to A','speak("A. A. Apple. Ant. Arm.")','speak')}</p><div id="feedback" class="feedback"></div>${btn('I listened! ⭐','listenDone()','secondary')}<div id="next" class="hidden">${btn('Next →','next()')}</div>`;return}if(step===2){found=new Set();root.innerHTML=`<span class="pill">Mission 2 · Letter Hunt</span><h2>Find A and a 🔎</h2><p>Tap all the A and a letters</p><div class="lettergrid">${['A','b','a','C','B','A','c','a'].map((x,i)=>`<button class="letter" id="l${i}" onclick="pickLetter(${i},'${x}')">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="next" class="hidden">${btn('Next →','next()')}</div>`;return}if(step===3){choice('Mission 3 · Listen & Choose','Listen and choose','Tap Listen, then choose the correct picture','Ant',[['🍎','Apple'],['🐜','Ant'],['🚗','Car']]);return}if(step===4){choice('Mission 4 · Word Pictures','Which starts with A?','Choose the picture that starts with A','Apple',[['⚽','Ball'],['🍎','Apple'],['🚗','Car']]);return}if(step===5){root.innerHTML=`<span class="pill">Mission 5 · Let’s Talk</span><h2>Look and Answer 💬</h2><div class="scene">🍎</div><p class="word">What is this?</p>${btn('🔊 Listen','speak("What is this?")','secondary')}<div class="options"><button class="option" onclick="answer(false,this)"><span class="emoji">🐜</span>It's an ant</button><button class="option" onclick="answer(true,this)"><span class="emoji">🍎</span>It's an apple</button><button class="option" onclick="answer(false,this)"><span class="emoji">⚽</span>It's a ball</button></div><div id="feedback" class="feedback"></div><div id="next" class="hidden">${btn('Next →','next()')}</div>`;return}if(step===6||step===7){writing=step===6?'A':'a';drawn=false;root.innerHTML=`<span class="pill">Mission ${step} · Writing</span><h2>Let's Write! ✏️</h2><div class="big">${writing}</div><p>${writing==='A'?'Capital A':'Small a'} — Trace with your finger or stylus</p><div class="canvasWrap"><div class="ghost">${writing}</div><canvas id="draw"></canvas></div><p class="hint">Follow the letter. Erase and try again anytime.</p>${btn('🧽 Erase','clearCanvas()','secondary')}${btn('🔊 Letter Sound','speak("${writing==='A'?'Capital A':'Small a'}")','secondary')}<div id="feedback" class="feedback"></div><div id="next" class="hidden">${btn(step===7?'Finish Adventure 🎉':'Next →','next()')}</div>${btn('I traced it! ⭐','finishDraw()')}`;setupCanvas();return}root.innerHTML=`<div class="confetti">🎉🏆🌟</div><h1>Excellent, ${safe(name)}!</h1><h2>Excellent ${safe(name)}!</h2><p>You completed the Letter A adventure!</p><div class="big">A a</div><p class="badge">You earned ${score} stars ⭐</p><p>Keep learning and shining!</p>${btn('Play Again 🔄','restart()')}`;bar.style.width='100%'}function start(){let n=document.getElementById('kid').value.trim();if(!n){document.getElementById('kid').focus();return}name=n;sessionStorage.setItem('suhailaName',n);step=1;render()}function listenDone(){if(lock)return;lock=true;reward('Great job')}function pickLetter(i,x){if(found.has(i))return;let el=document.getElementById('l'+i);if(x==='A'||x==='a'){found.add(i);el.classList.add('found');el.textContent=x+' ⭐';speak(x==='A'?'Capital A':'Small a');if(found.size===4)reward('You found all the letters')}else{el.style.background='#fff0f0';setTimeout(()=>el.style.background='',550);document.getElementById('feedback').textContent='Try again 💜'}}function choice(tag,title,desc,target,options){root.innerHTML=`<span class="pill">${tag}</span><h2>${title}</h2><p>${desc}</p>${btn('🔊 Listen','speak("${target}")','secondary')}<div class="options">${options.map(([emoji,label])=>`<button class="option" onclick="answer(${label===target},this)"><span class="emoji">${emoji}</span>${label}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="next" class="hidden">${btn('Next →','next()')}</div>`}function answer(ok,el){if(lock)return;if(ok){lock=true;el.classList.add('ok');speak('Excellent!');reward('Correct answer')}else{el.classList.add('bad');document.getElementById('feedback').textContent='Try again 💜';setTimeout(()=>el.classList.remove('bad'),650)}}let canvas,ctx,down=false;function setupCanvas(){canvas=document.getElementById('draw');let r=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(240*ratio);ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.strokeStyle='#8c6ab3';ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!down)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();drawn=true});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false)}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);drawn=false}function finishDraw(){if(lock)return;if(!drawn){document.getElementById('feedback').textContent='Trace the letter first ✏️';return}lock=true;reward('Beautiful work')}function restart(){step=0;score=0;render()}render();</script></body></html>
