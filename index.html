<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عالم سهيلة الصغير</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#665461;background:#fffcf8}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 60px}.hero{background:#f9e9eb;border-radius:30px;padding:32px 20px;text-align:center;border:1px solid #f0d7dc}.spark{font-size:35px}h1{font-size:clamp(26px,5vw,38px);margin:8px;color:#765868}h2{font-size:23px}p{line-height:1.8}.muted{color:#947f8a}.field{width:min(100%,340px);padding:15px;border:2px solid #e6cfdf;border-radius:16px;font-size:19px;text-align:center;background:white}.btn{border:0;border-radius:15px;padding:14px 24px;background:#a987a4;color:white;font-weight:bold;font-size:17px;cursor:pointer;margin-top:15px}.btn:focus-visible,.tile:focus-visible{outline:3px solid #795b9e;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:1px solid #eee0e6;border-radius:23px;padding:23px 8px;min-height:155px;cursor:pointer;font:inherit;color:#5b4d58;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.tile b{font-size:19px}.tile .emoji{font-size:38px}.pink{background:#f7e3e8}.lilac{background:#eae3f7}.mint{background:#e0f1e8}.cream{background:#fff0d8}.blue{background:#e1eff8}.section{margin-top:28px}.back{background:none;border:0;color:#846987;font-size:17px;cursor:pointer;padding:10px 0}.activity{background:white;border:1px solid #e8dce2;border-radius:22px;padding:20px;margin-top:16px}.tag{font-size:13px;color:#897481}footer{text-align:center;margin-top:40px;color:#9a8992;font-size:13px}[hidden]{display:none!important}@media(max-width:540px){.grid{grid-template-columns:1fr}.tile{min-height:100px;flex-direction:row}.tile .emoji{font-size:30px}}</style></head><body><main><div class="hero"><div class="spark">✦ 🌷 ✦</div><h1>عالم سهيلة الصغير</h1><div class="muted">مركز سهيلة بنت ملحان</div><p>نتعلّم بحب، ونكبر بإبداع</p></div><section id="welcome" class="section" style="text-align:center"><h2>مرحبًا يا بطل! ⭐</h2><p>ما اسمك؟</p><input id="kidname" class="field" maxlength="30" autocomplete="off" placeholder="اكتب اسمك هنا" aria-label="اسم الطفل"><br><button class="btn" id="start">ابدأ رحلتي ✨</button></section><section id="levels" class="section" hidden><h2 id="greeting"></h2><p>اختر مستواك لنبدأ المغامرة</p><div class="grid"><button class="tile pink" data-level="الأول"><span class="emoji">🌸</span><b>المستوى الأول</b></button><button class="tile lilac" data-level="الثاني"><span class="emoji">🦋</span><b>المستوى الثاني</b></button><button class="tile mint" data-level="الثالث"><span class="emoji">🌿</span><b>المستوى الثالث</b></button></div><button class="back" id="changeName">تغيير الاسم ↩</button></section><section id="subjects" class="section" hidden><button class="back" id="backLevels">↩ العودة للمستويات</button><h2 id="levelTitle"></h2><p>ماذا نحب أن نتعلّم اليوم؟</p><div class="grid"><button class="tile pink" data-subject="الحروف العربية"><span class="emoji">أ ب ت</span><b>الحروف العربية</b></button><button class="tile mint" data-subject="الأرقام والمفاهيم"><span class="emoji">١ ٢ ٣</span><b>الأرقام والمفاهيم</b></button><button class="tile blue" data-subject="اللغة الإنجليزية"><span class="emoji">ABC</span><b>اللغة الإنجليزية</b></button></div></section><section id="activities" class="section" hidden><button class="back" id="backSubjects">↩ العودة للمواد</button><h2 id="subjectTitle"></h2><div id="activityList" class="activity"></div></section><footer>صُنع بحب لأطفال مركز سهيلة بنت ملحان ♡</footer></main><script>const $=id=>document.getElementById(id);let name='',level='';function show(id){['welcome','levels','subjects','activities'].forEach(x=>$(x).hidden=x!==id)}$('start').onclick=()=>{name=$('kidname').value.trim();if(!name){$('kidname').focus();return}try{localStorage.setItem('suhaila_child_name',name)}catch(e){}$('greeting').textContent='أهلًا يا '+name+'! 🌟';show('levels')};$('kidname').addEventListener('keydown',e=>{if(e.key==='Enter')$('start').click()});try{$('kidname').value=localStorage.getItem('suhaila_child_name')||''}catch(e){}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;$('levelTitle').textContent='المستوى '+level;show('subjects')});document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{$('subjectTitle').textContent=b.dataset.subject+' — المستوى '+level;const box=$('activityList');if(level==='الثالث' && b.dataset.subject==='اللغة الإنجليزية'){box.innerHTML='<div style="font-size:32px">✏️ ⭐</div><h3>Letter A Adventure — A a</h3><p>استمع، اكتشف، اكتب الحرف الكبير والصغير واجمع النجوم!</p><a class="btn" style="display:inline-block;text-decoration:none" href="level3/english/letter-a/index.html">ابدأ المغامرة ✨</a>'}else{box.innerHTML='<div style="font-size:32px">⭐</div><h3>أنشطتنا قادمة قريبًا!</h3><p>هنا سنضيف التمارين والألعاب التعليمية الخاصة بهذا المستوى.</p>'}show('activities')});$('backLevels').onclick=()=>show('levels');$('backSubjects').onclick=()=>show('subjects');$('changeName').onclick=()=>show('welcome');</script></body></html>
